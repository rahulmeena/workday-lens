  <!-- Inner ring -->
  <g filter="url(#innerShadow)">
    <circle cx="512" cy="512" r="154" fill="none" stroke="url(#innerRing)" stroke-width="45"/>
    <circle cx="512" cy="512" r="176" fill="none" stroke="url(#innerLip)" stroke-width="9" opacity="0.75"/>
    <circle cx="512" cy="512" r="129" fill="none" stroke="#FFF7EA" stroke-width="8" opacity="0.9"/>
  </g>

  <!-- gentle glossy highlights -->
  <path d="M235 402C263 298 337 219 427 193" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" opacity="0.23"/>
