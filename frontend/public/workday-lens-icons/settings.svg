<svg width="1024" height="1024" viewBox="-120 -120 1264 1264" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Main warm dune gradient -->
    <radialGradient id="gearFill" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(390 250) rotate(52) scale(620 690)">
      <stop offset="0" stop-color="#FFF5E8"/>
      <stop offset="0.38" stop-color="#FFE8C9"/>
      <stop offset="0.72" stop-color="#FFD39B"/>
      <stop offset="1" stop-color="#F6A64D"/>
    </radialGradient>

    <!-- Soft rim gradient -->
    <linearGradient id="rimStroke" x1="285" y1="155" x2="785" y2="890" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFEBCB"/>
      <stop offset="0.45" stop-color="#F7B15E"/>
      <stop offset="1" stop-color="#E99037"/>
    </linearGradient>

    <!-- Inner ring gradient -->
    <radialGradient id="innerRing" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(500 430) rotate(76) scale(230 230)">
      <stop offset="0" stop-color="#FFE3B3"/>
      <stop offset="0.55" stop-color="#F8AE57"/>
      <stop offset="1" stop-color="#EA8730"/>
    </radialGradient>

    <!-- Inner lip highlight -->
    <linearGradient id="innerLip" x1="375" y1="330" x2="650" y2="650" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFEFD9"/>
      <stop offset="0.42" stop-color="#FDB65B"/>
      <stop offset="1" stop-color="#D97825"/>
    </linearGradient>

    <!-- Shadow -->
    <filter id="softShadow" x="-160" y="-160" width="1344" height="1344" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#D8892E" flood-opacity="0.18"/>
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#F2A24F" flood-opacity="0.18"/>
    </filter>

    <!-- Subtle bevel for puffy icon effect -->
    <filter id="bevel" x="-160" y="-160" width="1344" height="1344" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur"/>
      <feSpecularLighting in="blur" surfaceScale="8" specularConstant="0.35" specularExponent="18"
        lighting-color="#FFFFFF" result="spec">
        <fePointLight x="280" y="170" z="180"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="specOut"/>
      <feComposite in="SourceGraphic" in2="specOut" operator="arithmetic" k1="0" k2="1" k3="0.55" k4="0"/>
    </filter>

    <!-- Inner ring shadow -->
    <filter id="innerShadow" x="250" y="240" width="530" height="530" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#D97825" flood-opacity="0.28"/>
      <feDropShadow dx="0" dy="-5" stdDeviation="6" flood-color="#FFFFFF" flood-opacity="0.42"/>
    </filter>
  </defs>

  <!-- transparent background -->

